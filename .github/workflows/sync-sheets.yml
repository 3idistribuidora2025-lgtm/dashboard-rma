name: Sincronizar planilha RMA

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Buscar dados da planilha
        run: node scripts/sync-sheets.js

      - name: Commitar alterações (se houver)
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Sincroniza dados da planilha RMA"
          git push
